[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto3dlabel"
version = "0.1.0"
description = "Agentic 3D annotation tool — KITTI LiDAR + camera → 3D bbox drafts (AI-first, HITL)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AutoLabel Team" }]
keywords = ["annotation", "3d-detection", "lidar", "kitti", "llm-agent"]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    # torch/ultralytics/transformers/segment-anything-2 由 auto2dlabel 依赖覆盖（同环境安装）
    # 3D 代码经 create_detection_model / create_segmentation_model 间接使用，不直接 import
]

[project.scripts]
auto3dlabel = "auto3dlabel.cli:app"

[tool.setuptools.packages.find]
include = ["auto3dlabel*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E741"]  # 3D 领域惯例变量名 l（length，与 h/w 并列）

[tool.ruff.lint.per-file-ignores]
# calib 数据行 = 真实 calib_000000.txt 逐字提取（拆行破坏数据原文与可核对性）
"tests/helpers/synth.py" = ["E501"]
# Kalman 数学惯例变量名 P/S/K（协方差/新息/增益，与论文公式一致）
"tools/track3d.py" = ["N806"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# weights/ 为下载产物（权重 + mmdet3d 官方 configs，不入库不检查）
exclude = ["weights/"]

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["**/weights"]

[tool.pytest.ini_options]
testpaths = ["auto3dlabel/tests"]
python_files = ["test_*.py"]
