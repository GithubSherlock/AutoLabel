<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto3dLabel 复核</title>
<style>
  :root { --bg:#14161a; --panel:#1e2128; --border:#2c313c; --fg:#d7dae0; --dim:#8b93a3; --accent:#4da3ff; --red:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; height:100vh; }
  aside { width:280px; min-width:280px; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:12px; }
  aside h2 { font-size:15px; margin:4px 0 8px; color:var(--accent); }
  aside h3 { font-size:12px; margin:14px 0 6px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .file-item { padding:8px 10px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px; cursor:pointer; background:var(--bg); }
  .file-item:hover { border-color:var(--accent); }
  .file-item.active { border-color:var(--accent); background:#22304a; }
  .file-item .name { font-weight:600; font-size:13px; }
  .file-item .meta { font-size:12px; color:var(--dim); }
  main { flex:1; overflow-y:auto; padding:16px; }
  .imgs { display:flex; gap:12px; flex-wrap:wrap; }
  .imgs figure { margin:0; }
  .imgs img { max-width:620px; max-height:300px; border:1px solid var(--border); border-radius:6px; background:#000; }
  .imgs figcaption { font-size:12px; color:var(--dim); margin-top:4px; }
  table { border-collapse:collapse; width:100%; margin-top:14px; }
  th,td { border:1px solid var(--border); padding:6px 10px; text-align:left; font-size:13px; }
  th { color:var(--dim); font-weight:600; background:var(--panel); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .flag { color:#e8b339; font-weight:600; }
  .toolbar { margin-top:14px; display:flex; gap:10px; align-items:center; }
  button { background:var(--accent); color:#0c111a; border:0; border-radius:6px; padding:8px 18px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.del { background:transparent; color:var(--red); border:1px solid var(--red); padding:2px 10px; }
  #status { color:var(--dim); font-size:13px; }
  .empty { color:var(--dim); padding:24px; text-align:center; }
</style>
</head>
<body>
<aside>
  <h2>🕋 Auto3dLabel 复核</h2>
  <div id="dir" style="font-size:11px;color:var(--dim);word-break:break-all"></div>
  <h3>待复核</h3>
  <div id="files"></div>
  <h3>已复核</h3>
  <div id="reviewed"></div>
</aside>
<main>
  <div id="detail" class="empty">← 选择左侧队列文件开始复核</div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
