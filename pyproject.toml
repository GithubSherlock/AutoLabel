[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto2dlabel"
version = "0.3.0"
description = "Agentic 2D image annotation tool — AI-first, human-in-the-loop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AutoLabel Team" }]
keywords = ["annotation", "computer-vision", "llm-agent", "grounding-dino", "sam"]

dependencies = [
    "torch>=2.0",
    "torchvision",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pycocotools>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1",
    "mypy>=1.0",
]
detection = [
    "groundingdino-py>=0.4",
    "ultralytics>=8.0",
]
segmentation = [
    "segment-anything-2",
]
benchmark = [
    "pycocotools>=2.0",
    "nuscenes-devkit",
]
all = [
    "auto2dlabel[dev,detection,segmentation]",
]

[project.scripts]
auto2dlabel = "auto2dlabel.cli:app"

[tool.setuptools.packages.find]
include = ["auto2dlabel*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["auto2dlabel/tests"]
python_files = ["test_*.py"]
