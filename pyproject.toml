[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabel"
version = "1.0.0"
description = "Agentic image/point-cloud annotation tool — AI-first, human-in-the-loop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AutoLabel Team" }]
keywords = ["annotation", "computer-vision", "llm-agent", "grounding-dino", "sam"]

dependencies = [
    "torch>=2.0",
    "torchvision",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pycocotools>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",  # llm.py 导入期自动加载 configs/.env（曾 try/except 静默降级）
    "shapely>=2.0",
    "onnxruntime>=1.16",
    # 3D（auto3dlabel）新增依赖：DBSCAN 聚类（唯一新增），其余与 2D 共享
    "scikit-learn>=1.3",
    # v1.0 P1 TUI（版本评估见 docs/Agentic_UI_plan.md §8.1：锁上界防 8.x 重构破坏）
    "textual>=8.2.8,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1",
    "mypy>=1.0",
]
detection = [
    "groundingdino-py>=0.4",
    "ultralytics>=8.0",
]
segmentation = [
    "segment-anything-2",
]
benchmark = [
    "pycocotools>=2.0",
    "nuscenes-devkit",
]
all = [
    "auto2dlabel[dev,detection,segmentation]",
]

[project.scripts]
autolabel = "autolabel.cli:app"
auto2dlabel = "auto2dlabel.cli:app"
auto3dlabel = "auto3dlabel.cli:app"

[tool.setuptools.packages.find]
include = ["autolabel*", "auto2dlabel*", "auto3dlabel*"]

[tool.setuptools.package-data]
# v1.0 P1+：LLM prompt 外置 .md 随包分发（wheel 缺文件 → import 期 PromptLoadError）
"auto2dlabel.agent" = ["prompts/*.md"]
"auto3dlabel.agent" = ["prompts/*.md"]
# v1.0 P2：provider 注册表随包分发（wheel 缺文件 → 静默回退内置三条目，功能退化）
"auto2dlabel.configs" = ["providers.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
# vendored 官方 Florence-2 代码（Apache-2.0，第三方原样，见 vendor_florence2/README.md）
exclude = ["auto2dlabel/models/vendor_florence2"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
# 根项目名只自动识别 auto2dlabel 为 first-party；auto3dlabel/autolabel 显式声明
known-first-party = ["auto2dlabel", "auto3dlabel", "autolabel"]

[tool.ruff.lint.per-file-ignores]
# calib 数据行 = 真实 calib_000000.txt 逐字提取（拆行破坏数据原文与可核对性）
"auto3dlabel/tests/helpers/synth.py" = ["E501"]
# 3D 领域惯例变量名 l（length，与 h/w 并列）——原 auto3dlabel/pyproject.toml 合并至此
"auto3dlabel/**" = ["E741"]
# Kalman 数学惯例变量名 P/S/K（协方差/新息/增益，与论文公式一致）——原 auto3dlabel/pyproject.toml 合并至此
"auto3dlabel/tools/track3d.py" = ["N806"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# exclude 只对递归发现（`mypy .`）生效，显式目录 `mypy auto2dlabel/` 走 overrides
# cvat = 本地 CVAT 调研克隆（.gitignore 排除，不入库不检查）
exclude = ["auto2dlabel/models/vendor_florence2", "cvat",
           "auto3dlabel/weights", "auto2dlabel/weights"]

[[tool.mypy.overrides]]
module = "auto2dlabel.models.vendor_florence2.*"
ignore_errors = true

[[tool.mypy.overrides]]
# weights/ = 下载产物（模型权重 + 官方 configs，不入库不检查）
module = "auto3dlabel.weights.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "auto2dlabel.weights.*"
ignore_errors = true

[[tool.mypy.overrides]]
# textual 8.x py.typed 为 partial（8.x 重构中，App/work/on 等解析为 Any）——
# 第三方依赖类型不全照 vendor/weights 先例整包忽略
module = "textual.*"
ignore_errors = true

[[tool.mypy.overrides]]
# numpy 密集代码统一不写 ndarray 泛型参数（auto2dlabel 基线 74 个同款错误不追溯）
module = "auto3dlabel.*"
disable_error_code = ["type-arg"]

[tool.pyright]
typeCheckingMode = "basic"
# 显式 exclude 会替换 pyright 默认排除项 → 自带默认三项，否则 config 诊断告警
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    # cvat = 本地 CVAT 调研克隆（.gitignore 排除，不入库不检查）
    # weights/ = 下载产物（模型权重 + 官方 configs，不入库不检查）
    "auto2dlabel/models/vendor_florence2",
    "cvat",
    "auto3dlabel/weights",
    "auto2dlabel/weights",
]

[tool.pytest.ini_options]
testpaths = ["auto2dlabel/tests", "auto3dlabel/tests"]
python_files = ["test_*.py"]
